<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member - Book Manager</title>
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <style>
        body {
            
            font-family: "Courier New", Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background-color: #f0f0f0;
        }


        .container {
            width: 60%;
            text-align: center;
        }

      
        .nes-container {
            margin-bottom: 20px;
        }

        .button-container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

     
        pre {
            padding: 20px;
        }

        #booksList, #sort_form {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
      
        <div id="search_form" class="nes-container with-title">
            <p class="title">look for a Book</p>
            <div class="input">
                <input type="text" id="searchQuery" class="nes-input" placeholder="Search by title, author or the year">
            </div>
            <br />
            <div class="input">
                <button type="submit" class="nes-btn is-primary" id="searchBtn">Search</button>
            </div>
        </div>

        <div id="sort_form" class="nes-container with-title">
            <p class="title">Sort</p>
            <div class="button-container">
                <button class="nes-btn is-primary" onclick="sortBooks('title')">by Title</button>
                <button class="nes-btn is-success" onclick="sortBooks('year')">by Year</button>
            </div>
        </div>


        <div id="booksList" class="nes-container with-title">
            <p class="title">List of Books</p>
            <pre></pre>
        </div>
    </div>

    <script>
        // look for a book
        document.getElementById('searchBtn').addEventListener('click', function() {
            const query = document.getElementById('searchQuery').value;

            fetch(`/member/search?q=${query}`)
            .then(response => response.text())
            .then(data => {
              
                if (data.trim() !== "") {
                    document.querySelector('#booksList pre').innerText = data;
                    document.getElementById('booksList').style.display = 'block';
                    document.getElementById('sort_form').style.display = 'block';
                } else {
                    document.querySelector('#booksList pre').innerText = "No books found.";
                    document.getElementById('booksList').style.display = 'block';
                    document.getElementById('sort_form').style.display = 'none'; // Hide sort if na
                }
            });
        });

        function sortBooks(sortBy) {
            fetch(`/member/sort?sortBy=${sortBy}`)
            .then(response => response.text())
            .then(data => {
                document.querySelector('#booksList pre').innerText = data;
            });
        }
    </script>

</body>
</html>
