<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Manager</title>
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffffed;
            background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
        }

        #librarian_form,
        #loginForm,
        #response {
            width: 60%;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }


        .nes-container {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .button-container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }


        #response {
            display: none;
        }


        #response pre {
            padding: 20px;
        }


        #loginForm .nes-btn {
            width: 100%;
            font-size: 1.2rem;
        }


        .nes-btn {
            font-size: 1.1rem;
            padding: 10px 20px;
        }

        p.title {
            font-size: 1.5rem;
            text-transform: uppercase;
        }


        input.nes-input {
            padding: 10px;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <form id="loginForm" class="nes-container with-title is-dark">
        <p class="title">Use Key to Access</p>
        <div class="input-group">
            <input type="password" id="password" class="nes-input is-warning" placeholder="Enter password">
        </div>
        <div class="input-group">
            <button type="submit" class="nes-btn is-primary">Login</button>
        </div>
    </form>
    <div id="librarian_form" class="nes-container with-title is-dark" style="display:none;">
        <p class="title">Librarian Actions</p>

        <div class="input-group">
            <label for="title">Title</label>
            <input type="text" id="title" class="nes-input is-success" placeholder="Title">
        </div>
        <div class="input-group">
            <label for="author">Author</label>
            <input type="text" id="author" class="nes-input is-success" placeholder="Author">
        </div>
        <div class="input-group">
            <label for="year">Year</label>
            <input type="number" id="year" class="nes-input is-success" placeholder="Year">
        </div>

        <div class="button-container">
            <button type="submit" class="nes-btn is-primary" id="addBookBtn">Add Book</button>
            <button type="submit" class="nes-btn is-error" id="deleteBookBtn">Delete Book</button>
        </div>
    </div>

    <div id="response" class="nes-container with-title is-dark">
        <p class="title">Response</p>
        <pre></pre>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const password = document.getElementById('password').value;

            if (password === 'knowledge') {
                document.getElementById('librarian_form').style.display = 'block';
                document.getElementById('loginForm').style.display = 'none';
            } else {
                alert('Incorrect password');
            }
        });

        function showResponse(message) {
            const responseBox = document.getElementById('response');
            document.querySelector('#response pre').innerText = message;
            responseBox.style.display = 'block';
        }

        document.getElementById('addBookBtn').addEventListener('click', function (event) {
            event.preventDefault();
            const title = document.getElementById('title').value;
            const author = document.getElementById('author').value;
            const year = document.getElementById('year').value;

            fetch('/librarian/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, author, year })
            })
                .then(response => response.text())
                .then(data => {
                    showResponse(data);
                });
        });

        document.getElementById('deleteBookBtn').addEventListener('click', function (event) {
            event.preventDefault();
            const title = document.getElementById('title').value;

            fetch('/librarian/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            })
                .then(response => response.text())
                .then(data => {
                    showResponse(data);
                });
        });
    </script>

</body>

</html>
